version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
crownos-config = { workspace = true }
dirs = { workspace = true }
lockscene = { path = "../../crownpositor/lockscene" }
ron = { workspace = true }
serde = { workspace = true }
