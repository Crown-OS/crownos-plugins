[workspace]
members = ["model", "view", "proto", "render", "daemon", "cli", "sysassets"]
default-members = ["model", "view", "proto", "daemon", "cli", "sysassets"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/crown-os/crownos-plugins"

[workspace.dependencies]
crownplugin-model = { path = "model" }
crownplugin-view = { path = "view" }
crownplugin-proto = { path = "proto" }
crownos-config = { path = "../crownos-config", default-features = false }
crownos-ipc = { path = "../crownos-ipc" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
ron = "0.12"
dirs = "6"
tempfile = "3"

# lockscene names crownos-config the way crownpositor does; one copy of the
# crate keeps `Lock` and `Theme` the same type on both sides.
[patch."https://github.com/crown-os/crownos-config"]
crownos-config = { path = "../crownos-config" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
